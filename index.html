<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Idea Pad</h1>

        <form id="note-form">
            <textarea id="note-input" placeholder="Enter your idea here..." rows="4" required></textarea>
            <button type="submit">Add Note</button>
        </form>

        <div id="notes-container">
            <!-- Notes will be displayed here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
